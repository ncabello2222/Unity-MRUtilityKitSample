[project]
name = "da-mcp-server"
version = "0.1.0"
description = "D.A. Assets MCP server for Unity Editor integration."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.2,<4",
    "mcp>=1.16.0",
    "pydantic>=2.12.5",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
da-mcp-server = "da_mcp_server.cli:main"

[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
